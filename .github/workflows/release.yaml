name: Release Signadot CLI
on:
  push:
    tags:
    - 'v[0-9]+.[0-9]+.[0-9]'
    - 'v[0-9]+.[0-9]+.[0-9]+-xrc.[0-9]+'

jobs:
  release-cli:
    name: "Release CLI"
    env:
      GOPRIVATE: github.com/signadot/libconnect
      GH_ACCESS_TOKEN: ${{ secrets.SIGNADOT_GHA_GOBUILD_PAT }}

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Use a depth of 0 to fetch full history. This is the only way to fetch
        # tags, needed to choose a version number to embed.
        fetch-depth: 0

    - name: Read the Go version
      id: go-version
      run: |
        version=$(sed -nE 's/^FROM golang:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' .github/go/Dockerfile)
        # An empty go-version makes setup-go fall back to whatever Go the runner
        # has preinstalled, so fail rather than release with an unknown toolchain.
        if [ -z "$version" ]; then
          echo "::error::could not read an exact Go version from .github/go/Dockerfile"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version: ${{ steps.go-version.outputs.version }}

    - name: Prepare for GOPRIVATE
      run: |
        git config --global url.https://$GH_ACCESS_TOKEN@github.com/.insteadOf https://github.com/

    - name: Docker Login
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ secrets.DOCKERHUB_USER }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # https://github.com/docker/setup-qemu-action
    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
    
    # https://github.com/docker/setup-buildx-action
    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    # run goreleaser
    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
      with:
        version: "~> v2"
        args: release --clean
      env:
        SIGNADOT_IMAGE_SUFFIX: ''
        GITHUB_TOKEN: ${{ secrets.SIGNADOT_GHA_GOBUILD_PAT }}
        MCP_GITHUB_TOKEN: ${{ secrets.SIGNADOT_GHA_GOBUILD_PAT }}
